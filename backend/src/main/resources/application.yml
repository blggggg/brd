server:
  address: ${BRD_BIND:127.0.0.1}
  port: ${PORT:8091}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
spring:
  datasource:
    url: jdbc:h2:file:./data/brd;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  session:
    jdbc:
      initialize-schema: always
  flyway:
    enabled: true
brd:
  storage: ${BRD_STORAGE:./data/files}
  # Set BRD_ADMIN_PASSWORD in the environment for a fresh installation.
  admin-password: ${BRD_ADMIN_PASSWORD:}
  scanner: ${BRD_SCANNER:structural}
  clam-host: ${BRD_CLAM_HOST:127.0.0.1}
  clam-port: ${BRD_CLAM_PORT:3310}
